<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SHEINVERSE Campus Ambassador Dashboard</title>

    <link rel="icon" type="image/png" href="assets/favicon.png">

    <link rel="stylesheet" href="css/login.css">

</head>

<body>

    <div class="background"></div>

    <div class="overlay"></div>

    <div class="login-container">

        <img src="assets/logo.png" class="logo">

        <h1>SHEINVERSE Campus Ambassador Dashboard</h1>

        <p class="subtitle">
            Login to continue
        </p>

        <div class="login-card">

            <div class="input-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    autocomplete="off"
                    placeholder="Enter Username">

            </div>

            <div class="input-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter Password">

            </div>

            <button
                id="loginButton"
                onclick="login()">

                Login

            </button>

            <div
                id="loader"
                class="loader hidden">

                Authenticating...

            </div>

            <div
                id="message"
                class="message">

            </div>

        </div>

    </div>

    <script src="js/config.js"></script>
    <script src="js/login.js"></script>

</body>

</html>
