<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>SHEINVERSE Admin Dashboard</title>

<link rel="icon"
href="assets/favicon.png">

<link rel="stylesheet"
href="css/admin.css">

</head>

<body>

<div class="background"></div>

<div class="overlay"></div>

<header>

<div class="headerLeft">

<img
src="assets/logo.png"
class="logo">

<div>

<h1>

SHEINVERSE Admin Dashboard

</h1>

<p>

National Dashboard

</p>

</div>

</div>

<div class="headerRight">

<button
class="headerButton"
onclick="loadDashboard()">

Refresh

</button>

<button
class="headerButton logout"
onclick="logout()">

Logout

</button>

</div>

</header>

<section class="statsContainer">

<div class="statCard">

<span>

Colleges

</span>

<h2 id="collegeCount">

0

</h2>

</div>

<div class="statCard">

<span>

LCAs

</span>

<h2 id="lcaCount">

0

</h2>

</div>

<div class="statCard">

<span>

CAs

</span>

<h2 id="caCount">

0

</h2>

</div>

<div class="statCard">

<span>

Creators

</span>

<h2 id="creatorCount">

0

</h2>

</div>

<div class="statCard">

<span>

Approved Reels

</span>

<h2 id="reelCount">

0

</h2>

</div>

<div class="statCard">

<span>

Referrals

</span>

<h2 id="referralCount">

0

</h2>

</div>

</section>

<section
id="collegeContainer"
class="collegeContainer">

</section>

<template id="collegeTemplate">

<div class="collegeCard">

<div
class="collegeHeader"
onclick="toggleCollege(this)">

<div>

<h2 class="collegeName">

</h2>

<div class="collegeStats">

</div>

</div>

<div class="expandArrow">

▼

</div>

</div>

<div class="collegeBody">

<div class="lcaSection">

</div>

<div class="caSection">

</div>

</div>

</div>

</template>
